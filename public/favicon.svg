<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="nucleusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF85A1" />
      <stop offset="100%" stop-color="#A084E8" />
    </linearGradient>
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72C5FF" />
      <stop offset="100%" stop-color="#C4B0FF" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <rect width="64" height="64" rx="16" fill="#FFF9FB" />
  <!-- Orbits -->
  <ellipse cx="32" cy="32" rx="24" ry="9" stroke="url(#orbitGrad1)" stroke-width="2.5" transform="rotate(30 32 32)" stroke-dasharray="3 2" opacity="0.8" />
  <ellipse cx="32" cy="32" rx="24" ry="9" stroke="#FFB085" stroke-width="2.5" transform="rotate(-30 32 32)" opacity="0.8" />
  <ellipse cx="32" cy="32" rx="24" ry="9" stroke="#FFE17D" stroke-width="2.5" transform="rotate(90 32 32)" opacity="0.8" />
  <!-- Electrons -->
  <circle cx="14" cy="22" r="3.5" fill="#72C5FF" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="50" cy="42" r="3.5" fill="#FF85A1" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="32" cy="8" r="3.5" fill="#FFE17D" stroke="#FFFFFF" stroke-width="1.5" />
  <!-- Nucleus -->
  <circle cx="32" cy="32" r="8" fill="url(#nucleusGrad)" />
  <circle cx="30" cy="30" r="2.5" fill="#FFFFFF" opacity="0.6" />
</svg>